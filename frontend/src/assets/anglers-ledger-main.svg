<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="400" height="460">
  <title>Anglers' Ledger — A Fishing Journal</title>
  <desc>Hexagonal stamp logo with bush hat and hook emblem.</desc>

  <g transform="translate(200, 130)">
    <!-- Top text outside hexagon -->
    <text x="0" y="-100" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="500"
          fill="#0d4f5c" letter-spacing="2">— ANGLERS' LEDGER —</text>

    <!-- Hexagonal stamp (double border) -->
    <polygon points="0,-78 68,-39 68,39 0,78 -68,39 -68,-39"
             fill="none" stroke="#0d4f5c" stroke-width="2"/>
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35"
             fill="none" stroke="#0d4f5c" stroke-width="0.5"/>

    <!-- Bush hat -->
    <g transform="translate(0, 4)">
      <!-- Crown -->
      <path d="M -22,-8 Q -24,-22 -12,-28 Q 0,-32 12,-28 Q 24,-22 22,-8 L 22,2 L -22,2 Z" fill="#0d4f5c"/>
      <!-- Crown top pinch -->
      <path d="M -10,-26 Q 0,-22 10,-26" fill="none" stroke="#08323b" stroke-width="1" stroke-linecap="round"/>
      <!-- Hat band -->
      <rect x="-22" y="-2" width="44" height="5" fill="#c89968"/>
      <!-- Brim -->
      <path d="M -45,2 Q -48,4 -46,8 Q -44,12 -32,14 Q -16,18 0,18 Q 16,18 32,14 Q 44,12 46,8 Q 48,4 45,2 Z" fill="#0d4f5c"/>
      <!-- Brim shadow -->
      <path d="M -38,10 Q 0,16 38,10" fill="none" stroke="#08323b" stroke-width="1" stroke-linecap="round"/>
      <!-- Chin cord -->
      <path d="M -36,12 Q -28,28 -6,36" fill="none" stroke="#0d4f5c" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M 36,12 Q 28,28 6,36" fill="none" stroke="#0d4f5c" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Toggle -->
      <rect x="-4" y="34" width="8" height="6" rx="1.5" fill="#c89968"/>
      <!-- Cord below -->
      <path d="M -2,40 Q -3,46 -1,50" fill="none" stroke="#0d4f5c" stroke-width="1" stroke-linecap="round"/>
      <path d="M 2,40 Q 3,46 1,50" fill="none" stroke="#0d4f5c" stroke-width="1" stroke-linecap="round"/>
      <!-- Emblem -->
      <circle cx="0" cy="-15" r="4.5" fill="#c89968"/>
      <circle cx="0" cy="-15" r="4.5" fill="none" stroke="#08323b" stroke-width="0.5"/>
      <!-- Tiny hook -->
      <circle cx="0" cy="-17.5" r="0.7" fill="none" stroke="#08323b" stroke-width="0.5"/>
      <line x1="0" y1="-17" x2="0" y2="-14.5" stroke="#08323b" stroke-width="0.7" stroke-linecap="round"/>
      <path d="M 0,-14.5 Q 1.8,-13.2 1.5,-12 Q 0.8,-11 -0.5,-12"
            fill="none" stroke="#08323b" stroke-width="0.7" stroke-linecap="round"/>
    </g>

    <!-- Bottom text outside hexagon -->
    <text x="0" y="100" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="500"
          fill="#8a7456" letter-spacing="2">· EST · 2026 ·</text>
  </g>

  <!-- Wordmark -->
  <text x="200" y="295" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="500"
        font-style="italic" fill="#0d4f5c">Anglers' Ledger</text>
  <text x="200" y="320" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500"
        fill="#8a7456" letter-spacing="4">A FISHING JOURNAL</text>
</svg>
